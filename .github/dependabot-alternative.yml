# 备选 Dependabot 配置 - 如果主配置仍有问题，可以替换 dependabot.yml
version: 2
updates:
  # npm 依赖更新 - 仅直接依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "winjs-dev"
    assignees:
      - "winjs-dev"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 严格限制：只更新直接依赖
    allow:
      - dependency-type: "direct"
    # 完全忽略所有传递依赖相关的包
    ignore:
      - dependency-name: "esbuild"
      - dependency-name: "@esbuild/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
        dependency-type: "indirect"

  # GitHub Actions 更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "winjs-dev"
    assignees:
      - "winjs-dev"
    commit-message:
      prefix: "ci"
      include: "scope" 