version: 2
updates:
  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "winjs-dev"
    assignees:
      - "winjs-dev"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 忽略 esbuild，因为我们使用 pnpm overrides 管理
    ignore:
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions 更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "winjs-dev"
    assignees:
      - "winjs-dev"
    commit-message:
      prefix: "ci"
      include: "scope" 